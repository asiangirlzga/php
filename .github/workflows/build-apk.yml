name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK is preinstalled on ubuntu-latest (ANDROID_HOME is set),
      # so no separate SDK setup step is needed.

      # The project has no Gradle wrapper, so install Gradle directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build release APK with Debug Logs
        run: |
          gradle assembleRelease --no-daemon --debug > gradle_debug.log 2>&1 || true
          cat gradle_debug.log
          if grep -q "BUILD FAILED" gradle_debug.log; then exit 1; fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk HindiTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HindiTV-apk
          path: HindiTV.apk

      # Pushing a tag like v1.0 also publishes the APK as a GitHub Release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HindiTV.apk
