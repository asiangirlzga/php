name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # No Gradle wrapper in the repo, so install Gradle directly.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check for php binaries
        run: |
          if ! find app/src/main/jniLibs -name 'libphp.so' | grep -q .; then
            echo "::warning::No libphp.so found in app/src/main/jniLibs/<abi>/ - the APK will build but the app will report 'php binary not found' at runtime."
          fi

      # Debug builds are signed with the default debug key, so the APK
      # installs directly on a device (an unsigned release APK would not).
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain --warning-mode=summary 2>&1 | tee build.log || {
            echo "=== ERROR SUMMARY ==="
            grep -nE "^e: |error:|What went wrong|Execution failed|> .*(not found|Could not|failed)|AAPT" -A4 build.log | head -80
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhpServerApp.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhpServerApp-apk
          path: PhpServerApp.apk

      # Pushing a tag like v1.0 also publishes the APK as a GitHub Release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PhpServerApp.apk
